apiVersion: apps/v1
kind: Deployment
metadata:
  name: higgs
  labels:
    app: higgs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: higgs
  template:
    metadata:
      labels:
        app: higgs
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /feed.xml
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: feed
              mountPath: /usr/share/nginx/html/feed.xml
              subPath: feed.xml
              readOnly: true
            - name: feed
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: feed
              mountPath: /usr/share/nginx/html/logo.svg
              subPath: logo.svg
              readOnly: true
            - name: feed
              mountPath: /usr/share/nginx/html/logo.png
              subPath: logo.png
              readOnly: true
            # Importerede feeds (build.py: FEEDS) monteres på deres URL-sti.
            # >>> importerede feeds (volumeMounts) — vedligeholdes af scripts/import-librivox.py >>>
            - name: feed-tao-lieh-tzu
              mountPath: /usr/share/nginx/html/tao/lieh-tzu/feed.xml
              subPath: feed.xml
              readOnly: true
            - name: feed-tao-sayings-of-lao-tzu
              mountPath: /usr/share/nginx/html/tao/sayings-of-lao-tzu/feed.xml
              subPath: feed.xml
              readOnly: true
            - name: feed-tao-musings-of-a-chinese-mystic
              mountPath: /usr/share/nginx/html/tao/musings-of-a-chinese-mystic/feed.xml
              subPath: feed.xml
              readOnly: true
            # <<< importerede feeds (volumeMounts) <<<
            - name: media
              mountPath: /usr/share/nginx/html/media
      volumes:
        - name: feed
          configMap:
            name: higgs-feed
        # >>> importerede feeds (volumes) — vedligeholdes af scripts/import-librivox.py >>>
        - name: feed-tao-lieh-tzu
          configMap:
            name: higgs-feed-tao-lieh-tzu
        - name: feed-tao-sayings-of-lao-tzu
          configMap:
            name: higgs-feed-tao-sayings-of-lao-tzu
        - name: feed-tao-musings-of-a-chinese-mystic
          configMap:
            name: higgs-feed-tao-musings-of-a-chinese-mystic
        # <<< importerede feeds (volumes) <<<
        - name: media
          persistentVolumeClaim:
            claimName: higgs-media
