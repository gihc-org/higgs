apiVersion: apps/v1
kind: Deployment
metadata:
  name: higgs
  labels:
    app: higgs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: higgs
  template:
    metadata:
      labels:
        app: higgs
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /feed.xml
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: feed
              mountPath: /usr/share/nginx/html/feed.xml
              subPath: feed.xml
              readOnly: true
            - name: feed
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: media
              mountPath: /usr/share/nginx/html/media
      volumes:
        - name: feed
          configMap:
            name: higgs-feed
        - name: media
          persistentVolumeClaim:
            claimName: higgs-media
