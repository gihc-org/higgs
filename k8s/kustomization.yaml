apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: higgs
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pvc.yaml
  - ipfs.yaml
configMapGenerator:
  - name: higgs-feed
    files:
      - feed.xml
      - logo.svg
      - logo.png
      - nginx/default.conf
  # Ét feed pr. ConfigMap: content-hash pr. feed, og 1 MiB-grænsen gælder kun
  # det enkelte feeds filer. Artefakterne genereres af build.py (FEEDS).
  # >>> importerede feeds (configMapGenerator) — vedligeholdes af scripts/import-librivox.py >>>
  - name: higgs-feed-tao-lieh-tzu
    files:
      - feeds/tao/lieh-tzu/feed.xml
  - name: higgs-feed-tao-sayings-of-lao-tzu
    files:
      - feeds/tao/sayings-of-lao-tzu/feed.xml
  - name: higgs-feed-tao-musings-of-a-chinese-mystic
    files:
      - feeds/tao/musings-of-a-chinese-mystic/feed.xml
  # <<< importerede feeds (configMapGenerator) <<<
