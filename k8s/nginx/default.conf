server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;

    location = /feed.xml {
        types { application/atom+xml xml; }
        default_type application/atom+xml;
    }

    location / {
        try_files $uri =404;
    }
}
